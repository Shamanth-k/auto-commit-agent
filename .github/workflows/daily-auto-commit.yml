name: Daily Auto Commit

on:
  schedule:
    # 00:30 UTC = 06:00 IST
    - cron: "30 0 * * *"

  workflow_dispatch:

concurrency:
  group: daily-auto-commit
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  daily-run:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout automation repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Install pytest
        run: python -m pip install pytest

      - name: Configure automation Git
        run: |
          git config user.name "${{ vars.COMMIT_NAME }}"
          git config user.email "${{ vars.COMMIT_EMAIL }}"

      - name: Clone target repository
        env:
          TARGET_TOKEN: ${{ secrets.AUTO_COMMIT_PAT }}
        run: |
          git clone "https://x-access-token:${TARGET_TOKEN}@github.com/${{ vars.TARGET_REPOSITORY }}.git" "$RUNNER_TEMP/target"

      - name: Configure target Git
        working-directory: ${{ runner.temp }}/target
        run: |
          git config user.name "${{ vars.COMMIT_NAME }}"
          git config user.email "${{ vars.COMMIT_EMAIL }}"

      - name: Run daily automation
        env:
          PROJECT_REPOSITORY: ${{ runner.temp }}/target
          AGENT_REPOSITORY: ${{ github.workspace }}
          TASK_POOL: ${{ github.workspace }}/tasks/task_pool.json
          TASK_STATE: ${{ github.workspace }}/tasks/state.json
        run: |
          python -m app.daily_run

      - name: Push target repository
        working-directory: ${{ runner.temp }}/target
        env:
          TARGET_TOKEN: ${{ secrets.AUTO_COMMIT_PAT }}
        run: |
          git push "https://x-access-token:${TARGET_TOKEN}@github.com/${{ vars.TARGET_REPOSITORY }}.git" main

      - name: Push automation state
        env:
          AGENT_TOKEN: ${{ secrets.AUTO_COMMIT_PAT }}
        run: |
          git push "https://x-access-token:${AGENT_TOKEN}@github.com/${{ github.repository }}.git" main
